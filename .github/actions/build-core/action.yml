name: Build core packages
description: Restore or build shared core package outputs and generated files. Run after installing workspace dependencies.

runs:
  using: composite
  steps:
    - name: Get Node version
      id: node-version
      shell: bash
      run: |
        node_version=$(node --version)
        echo "version=$node_version" >> "$GITHUB_OUTPUT"

    - name: Restore core build output
      id: cache-core
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          packages/core/standard/dist
          packages/core/standard/src/generated
          packages/core/api/dist
          packages/core/ui-svelte/dist
          packages/core/ui-svelte/.svelte-kit
          packages/core/legacy/dist
        key: core-dist-v2-${{ runner.os }}-node-${{ steps.node-version.outputs.version }}-${{ hashFiles('packages/core/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', '!**/node_modules/**', '!**/dist/**', '!**/.svelte-kit/**', '!**/generated/**', '!**/coverage/**') }}

    - name: Build core packages
      if: steps.cache-core.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm run dependencies:build
