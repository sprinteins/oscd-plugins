name: Quality Check @oscd-plugins/io-center

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugins/io-center/**'
      - 'packages/core/api/**'
      - 'packages/core/standard/**'
      - 'packages/core/ui-svelte/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/_quality.yml'
      - '.github/actions/build-core/**'
      - '.github/workflows/plugin_io-center-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml
    with:
      package-name: io-center
