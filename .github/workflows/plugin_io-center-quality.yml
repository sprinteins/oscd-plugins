name: Quality Check @oscd-plugins/io-center

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugins/io-center/**'

jobs:
  build:
    name: Build Project
    uses: ./.github/workflows/_build.yml
    with:
      package-name: io-center

  check:
    name: Check Project
    uses: ./.github/workflows/_check.yml
    with:
      package-name: io-center
