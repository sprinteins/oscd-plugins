name: Quality Check @oscd-plugins/communication-explorer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugins/communication-explorer/**'

jobs:
  build:
    name: Build Project
    uses: ./.github/workflows/_build.yml
    with:
      package-name: communication-explorer

  check:
    name: Check Project
    uses: ./.github/workflows/_check.yml
    with:
      package-name: communication-explorer
