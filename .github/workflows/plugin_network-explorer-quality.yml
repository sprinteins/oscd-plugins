name: Quality Check @oscd-plugins/network-explorer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugins/network-explorer/**'

jobs:
  build:
    name: Build Project
    uses: ./.github/workflows/_build.yml
    with:
      package-name: network-explorer

  check:
    name: Check Project
    uses: ./.github/workflows/_check.yml
    with:
      package-name: network-explorer

  test:
    name: Run Tests
    uses: ./.github/workflows/_test.yml
    with:
      package-name: network-explorer
      has-coverage: true

  lint:
    name: Lint Code
    uses: ./.github/workflows/_lint.yml
    with:
      package-name: network-explorer
