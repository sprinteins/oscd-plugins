name: Quality Check @oscd-plugins/type-switcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugins/type-switcher/**'

jobs:
  build:
    name: Build Project
    uses: ./.github/workflows/_build.yml
    with:
      package-name: type-switcher

  check:
    name: Check Project
    uses: ./.github/workflows/_check.yml
    with:
      package-name: type-switcher

  test:
    name: Run Tests
    uses: ./.github/workflows/_test.yml
    with:
      package-name: type-switcher
      has-coverage: true

  lint:
    name: Lint Code
    uses: ./.github/workflows/_lint.yml
    with:
      package-name: type-switcher
