name: Dependency Quality

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared_required: ${{ steps.paths.outputs.shared_required }}
      lint_required: ${{ steps.paths.outputs.lint_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch base and head commits
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Detect package and workflow changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'

          const files = process.env.EVENT_NAME === 'workflow_dispatch'
            ? ['pnpm-lock.yaml']
            : execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).trim().split('\n')
          const sharedRequired = files.some(file => /^(package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|biome\.json$|packages\/(core|ui|uilib)\/|\.github\/(dependabot\.yml$|workflows\/|actions\/))/.test(file))
          const lintRequired = sharedRequired || files.some(file => /^packages\/plugins\//.test(file))
          appendFileSync(process.env.GITHUB_OUTPUT, `shared_required=${sharedRequired}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `lint_required=${lintRequired}\n`)
          NODE

  shared:
    name: Shared packages
    needs: changes
    if: needs.changes.outputs.shared_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages
        uses: ./.github/actions/build-core

      - name: Build UI packages
        run: pnpm --filter @oscd-plugins/ui --filter @oscd-plugins/uilib run build

      - name: Run UILib tests
        run: pnpm --dir packages/uilib run test

      - name: Run core browser tests
        run: pnpm --dir packages/core/legacy run test:watch --run --browser.headless

      - name: Check shared package types
        run: |
          pnpm --filter './packages/core/*' --filter @oscd-plugins/ui --filter @oscd-plugins/uilib --if-present run check
          pnpm --filter './packages/core/*' --if-present run types

  lint:
    name: Repository lint
    needs: changes
    if: needs.changes.outputs.lint_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm run biome:check

  quality:
    name: Dependency quality gate
    needs: [changes, shared, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARED_REQUIRED: ${{ needs.changes.outputs.shared_required }}
          SHARED_RESULT: ${{ needs.shared.result }}
          LINT_REQUIRED: ${{ needs.changes.outputs.lint_required }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          [[ "$CHANGES_RESULT" == 'success' ]] || exit 1
          if [[ "$SHARED_REQUIRED" == 'true' ]]; then
            [[ "$SHARED_RESULT" == 'success' ]] || exit 1
          fi
          if [[ "$LINT_REQUIRED" == 'true' ]]; then
            [[ "$LINT_RESULT" == 'success' ]] || exit 1
          fi