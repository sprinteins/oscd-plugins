name: Plugin Quality

on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
      has-tests:
        required: false
        type: boolean
        default: false
      has-coverage:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install plugin and its workspace dependencies
        run: pnpm --filter "@oscd-plugins/${{ inputs.package-name }}..." install --frozen-lockfile

      - name: Build core packages
        uses: ./.github/actions/build-core

      - name: Check package
        run: pnpm --dir packages/plugins/${{ inputs.package-name }} run check

      - name: Run tests
        if: inputs.has-tests && !inputs.has-coverage
        run: pnpm --dir packages/plugins/${{ inputs.package-name }} exec vitest run

      - name: Run tests with coverage
        if: inputs.has-tests && inputs.has-coverage
        run: pnpm --dir packages/plugins/${{ inputs.package-name }} exec vitest run --coverage

      - name: Build package
        run: pnpm --dir packages/plugins/${{ inputs.package-name }} run build

      - name: Upload coverage report
        if: always() && inputs.has-tests && inputs.has-coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.package-name }}-coverage
          path: packages/plugins/${{ inputs.package-name }}/coverage
          if-no-files-found: ignore
          retention-days: 7
